# XcodeGen spec for Pocket, helm's iPhone app (#625). See README.md.
#
# `xcodegen generate --spec Pocket/project.yml` writes Pocket/Pocket.xcodeproj (gitignored).
# helm's wire, benchd's client and Pocket's logic compile from ../Sources as static libraries,
# the way project.yml builds HelmWire for helm. They are not taken from Package.swift: resolving
# it would fetch Ghostty's binary and the injection packages for an app that uses none of them.
# Keep these source paths in step with Package.swift's HelmWire, BenchKit, CanvasKit and
# PocketKit targets.
name: Pocket
options:
  bundleIdPrefix: com.wirasm
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # `package` access across the three libraries and the app, as SwiftPM gives helm's targets
    # from `name: "helm"`. Every target must agree on it.
    SWIFT_PACKAGE_NAME: helm
    # Pure Swift throughout: no target reads an Objective-C header, so none is generated or
    # copied. Copying HelmWire-Swift.h over the last build's failed in Xcode with "Operation not
    # permitted" on a second run to a phone, and an unused header is not worth a workaround.
    SWIFT_INSTALL_OBJC_HEADER: NO

targets:
  HelmWire:
    type: library.static
    platform: iOS
    sources:
      - path: ../Sources/HelmWire
  BenchKit:
    type: library.static
    platform: iOS
    sources:
      - path: ../Sources/BenchKit
    dependencies:
      - target: HelmWire
  CanvasKit:
    type: library.static
    platform: iOS
    sources:
      - path: ../Sources/CanvasKit
    dependencies:
      - target: HelmWire
      - target: BenchKit
  PocketKit:
    type: library.static
    platform: iOS
    sources:
      - path: ../Sources/PocketKit
    dependencies:
      - target: HelmWire
      - target: BenchKit
      - target: CanvasKit
  Pocket:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: HelmWire
      - target: BenchKit
      - target: CanvasKit
      - target: PocketKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pocket
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # benchd is reached over Tailscale; iOS may ask before a first connection to it.
        NSLocalNetworkUsageDescription: Pocket reaches benchd on your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wirasm.pocket
        TARGETED_DEVICE_FAMILY: "1"
        # Set your own team in Xcode to install on a phone (README.md); the gate builds unsigned.
        CODE_SIGN_STYLE: Automatic
