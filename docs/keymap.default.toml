# helm's built-in keymap, generated from KeyBindings.all — do not edit this copy.
#
# To change a key, write ~/.helm/bench/keymap.toml (~/.helm/bench-<suite>/ for an
# isolated helm, $HELM_BENCH_DIR when set). It overlays these rows and reloads live:
#   - a [[bind]] row replaces the built-in rows with the same key in an overlapping `when`,
#     or adds a key;
#   - unbind = ["cmd+shift+r"] removes a built-in key;
#   - manage = "cmd+ctrl" moves every manage+ key below onto another modifier. It must
#     include cmd, so it never takes a key a terminal types, and cannot include shift;
#   - a file that does not parse changes nothing, and the status bar says why.
# Copying this whole file in is valid and changes nothing.
#
# key:    manage, cmd, ctrl, alt, shift joined by + before one character, plus, left,
#         right, up, down or keycode:N. manage is the manage key: hold it and the
#         manage+ keys arrange the bench, release it and the keyboard types again
# when:   anywhere (the default), terminal, away-from-terminal, browser (a browser pane's
#         page or address field has the keyboard), away-from-browser
# action: one of the names below; index is 1-based. `drawer` takes name and, optionally,
#         surface = "browser", "sessions", "archon", "worktrees" or "file:<path>" for a
#         drawer that holds nothing.
#         `just` takes recipe: a recipe in <bench root>/rules/justfile, run by benchd as you
#
# A drawer's place is a table of its own, e.g.
#   [drawer.notes]
#   edge = "left"             # left, right or bottom
#   size = 0.3                # 0.1 to 0.9 of the window's width, or height on the bottom
# Built in: sessions on the left at 0.28, archon on the bottom at 0.42, every other
#   drawer on the right at 0.5. The edge is only the default: drag a drawer by its
#   header to another edge and benchd keeps that one instead.

