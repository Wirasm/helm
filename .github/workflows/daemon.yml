# The daemon gate as its own CI job, apart from the Swift one like pi/. It runs on EVERY
# pull request and exits early when daemon/ is untouched — deliberately, because this
# check is a required status: a job that only triggers on daemon/** paths never reports
# on a Swift-only PR, and a required check that never reports blocks the merge forever.
# Always report, spend nothing when there is nothing to gate.
name: daemon

on:
  pull_request:

jobs:
  gate:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The path rule lives in scripts/check.sh, so `just check` and this job agree on it.
      - name: did daemon/ change?
        id: changed
        run: |
          if bash scripts/check.sh --needs daemon "origin/${{ github.base_ref }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "daemon/ untouched — gate satisfied by construction"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The just layer's conformance test runs a real `just` (#356), and fails in CI without it.
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - if: steps.changed.outputs.run == 'true'
        run: bash scripts/check.sh daemon
