# The daemon gate as its own CI job, per the pi/-and-hooks/ pattern. It runs on EVERY
# pull request and exits early when daemon/ is untouched — deliberately, because this
# check is a required status: a job that only triggers on daemon/** paths never reports
# on a Swift-only PR, and a required check that never reports blocks the merge forever.
# Always report, spend nothing when there is nothing to gate.
name: daemon

# The push to development exists to save the cargo cache below: a PR can only read caches
# saved on its base branch, and this workflow used to run on nothing else.
on:
  pull_request:
  push:
    branches: [development]

jobs:
  gate:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The path rule lives in scripts/check.sh, so `just check` and this job agree on it.
      - name: did daemon/ change?
        id: changed
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: |
          if bash scripts/check.sh --needs daemon "$BASE"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "daemon/ untouched — gate satisfied by construction"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved from development only, for the reason on `on:` above.
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          save-if: ${{ github.event_name == 'push' || github.head_ref == 'feat/ci-speed' }}
      - if: steps.changed.outputs.run == 'true'
        run: bash scripts/check.sh daemon
