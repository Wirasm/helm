name: gate

# The three things that must be true before a merge: it builds, the tests pass, the
# formatter is happy. Nothing else — no coverage threshold, no lint-of-the-lint, no
# required reviewers. This project is three of us and our agents, and every rule added
# here is a rule an agent has to satisfy at 3am with nobody to ask.
#
# WHY THIS EXISTS AT ALL. Two PRs merged 56 seconds apart on 2026-08-06, both green on
# their own branches, both reviewed. #254 replaced a function; #255 called it. Git merged
# them with no textual conflict because they touch different files, and `development` did
# not compile. The same night, in the same batch, #247 renamed `ownerPid` and #246 listed
# it by name — same shape, and that one took a gate down instead of the build.
#
# Neither is catchable by reviewing a diff. What catches them is running the gate against
# the MERGE, which is what `pull_request` does here: GitHub builds the merge commit, not
# the branch tip.
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: build · test · format
    # **macos-26, and this is the whole of why the gate was red.** The `macos-15` image
    # defaults to Xcode 16.4 / Swift 6.1. Swift 6.2 changed main-actor isolation inference and
    # this codebase is written against it, so under 6.1 it does not compile — **126 errors**,
    # every one the same sentence: "main actor-isolated property … can not be referenced from a
    # nonisolated context". Seven runs, six branches, zero green: #267's diff was entirely
    # `BenchSnapshot` and it died in `Capture/WindowCapture.swift`, which no branch touched.
    #
    # The wrong fix is annotating files one at a time. #276 did two of them, honestly, and it
    # was treating a symptom — there were 124 more. **Pin the toolchain, not the source.**
    #
    # If this label ever goes away, the fix is still a toolchain pin (`setup-xcode` at 26.2 on
    # an image that carries it), never a sweep of `@MainActor` annotations to satisfy an older
    # compiler than the one anyone develops on.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Printed before anything can fail, because the first red run cost an evening to diagnose
      # and one line would have answered it.
      - name: toolchain
        run: |
          swift --version
          xcodebuild -version

      # The patched libghostty is gitignored, so a fresh checkout has nothing to link
      # against. First and not optional — the same sentence AGENTS.md opens with.
      - name: patch libghostty
        run: bash scripts/patch-libghostty.sh

      - name: build
        run: swift build

      # TerminalKeyboardTests and WorkbenchFocusRoutingTests need a real ghostty surface,
      # and a surface needs an ACTIVE display (#253). A CI runner has none, so those two
      # would fail here for a reason that is not the diff. Excluded rather than tolerated:
      # a gate whose red is sometimes meaningless is a gate nobody reads.
      #
      # INJECTION_NOGENERICS=1 is not optional with --skip. Anything that makes SwiftPM
      # enumerate goes through `swiftpm-xctest-helper`, which dies with `signalled(10)`
      # when InjectionNext rebinds symbols under it — AGENTS.md documents this for
      # `--filter` and it is the same path. Measured: without it, `--skip` dies the same
      # way; with it, 1041 tests, 0 failures.
      - name: test
        run: INJECTION_NOGENERICS=1 swift test --skip TerminalKeyboardTests --skip WorkbenchFocusRoutingTests

      - name: format
        run: make lint

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

  # Separate job because it needs node and the Swift gate must not: a Swift contributor
  # should never need a JS toolchain to go green, which is why AGENTS.md keeps these apart.
  # Only runs when the files it covers actually change.
  hooks:
    name: mailbox hooks · conformance
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The conformance harness imports pi's .ts directly, which needs type stripping —
          # and the floor for that is 22.18, not 22.6. 22.6 is where `--experimental-strip-types`
          # was ADDED; the harness passes no flags, so what it needs is the version where
          # stripping is on by DEFAULT. Pinning the flag's version pinned a node that refuses.
          #
          # Measured, by downloading both and running them rather than reading a changelog:
          #   v22.6.0  → process.features.typescript === undefined
          #   v22.18.0 → process.features.typescript === "strip"
          # And measured in CI first — run 31128899140 is this job red on a branch that touched
          # no JavaScript at all, saying `node v22.6.0 cannot strip TypeScript`. That refusal is
          # `requireTypeStripping()` working exactly as designed: it fails rather than skipping,
          # because a skip is the silent zero the harness exists to forbid. The gate was right
          # and the pin was wrong.
          node-version: '22.18'
      - name: hooks gate
        run: bash hooks/test.sh

  skills:
    name: skill gates
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: mail skills
        run: bash .claude/skills/helm-mail-cc/test.sh
      - name: canvas skill
        run: bash .claude/skills/helm-canvas/test.sh
      # Needs node, which this job already has by virtue of the runner image. A gate that
      # exists, is documented in AGENTS.md, and runs only when somebody remembers is the
      # drift this workflow exists to stop — #291 is the same lesson from the other side.
      - name: board skill
        run: bash .claude/skills/helm-board/test.sh
