name: gate

# The three things that must be true before a merge: it builds, the tests pass, the
# formatter is happy. Nothing else — no coverage threshold, no lint-of-the-lint, no
# required reviewers. This project is three of us and our agents, and every rule added
# here is a rule an agent has to satisfy at 3am with nobody to ask.
#
# WHY THIS EXISTS AT ALL. Two PRs merged 56 seconds apart on 2026-08-06, both green on
# their own branches, both reviewed. #254 replaced a function; #255 called it. Git merged
# them with no textual conflict because they touch different files, and `development` did
# not compile. The same night, in the same batch, #247 renamed `ownerPid` and #246 listed
# it by name — same shape, and that one took a gate down instead of the build.
#
# Neither is catchable by reviewing a diff. What catches them is running the gate against
# the MERGE, which is what `pull_request` does here: GitHub builds the merge commit, not
# the branch tip.
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: build · test · format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The patched libghostty is gitignored, so a fresh checkout has nothing to link
      # against. First and not optional — the same sentence AGENTS.md opens with.
      - name: patch libghostty
        run: bash scripts/patch-libghostty.sh

      - name: build
        run: swift build

      # TerminalKeyboardTests and WorkbenchFocusRoutingTests need a real ghostty surface,
      # and a surface needs an ACTIVE display (#253). A CI runner has none, so those two
      # would fail here for a reason that is not the diff. Excluded rather than tolerated:
      # a gate whose red is sometimes meaningless is a gate nobody reads.
      #
      # INJECTION_NOGENERICS=1 is not optional with --skip. Anything that makes SwiftPM
      # enumerate goes through `swiftpm-xctest-helper`, which dies with `signalled(10)`
      # when InjectionNext rebinds symbols under it — AGENTS.md documents this for
      # `--filter` and it is the same path. Measured: without it, `--skip` dies the same
      # way; with it, 1041 tests, 0 failures.
      - name: test
        run: INJECTION_NOGENERICS=1 swift test --skip TerminalKeyboardTests --skip WorkbenchFocusRoutingTests

      - name: format
        run: make lint

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

  # Separate job because it needs node and the Swift gate must not: a Swift contributor
  # should never need a JS toolchain to go green, which is why AGENTS.md keeps these apart.
  # Only runs when the files it covers actually change.
  hooks:
    name: mailbox hooks · conformance
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The conformance harness imports pi's .ts directly, which needs type stripping.
          node-version: '22.6'
      - name: hooks gate
        run: bash hooks/test.sh

  skills:
    name: skill gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: mail skills
        run: bash .claude/skills/helm-mail-cc/test.sh
      - name: canvas skill
        run: bash .claude/skills/helm-canvas/test.sh
