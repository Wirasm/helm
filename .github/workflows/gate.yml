name: gate

# The things that must be true before a merge: it builds, the tests pass, the formatter is
# happy, and no new code crosses a size or complexity limit (`.swiftlint.yml`, #418; code that
# was already over one is marked and does not fail). Nothing else — no coverage threshold, no
# lint-of-the-lint, no required reviewers. This project is three of us and our agents, and
# every rule added here is a rule an agent has to satisfy at 3am with nobody to ask.
#
# WHY THIS EXISTS AT ALL. Two PRs merged 56 seconds apart on 2026-08-06, both green on
# their own branches, both reviewed. #254 replaced a function; #255 called it. Git merged
# them with no textual conflict because they touch different files, and `development` did
# not compile. The same night, in the same batch, #247 renamed `ownerPid` and #246 listed
# it by name — same shape, and that one took a gate down instead of the build.
#
# Neither is catchable by reviewing a diff. What catches them is running the gate against
# the MERGE, which is what `pull_request` does here: GitHub builds the merge commit, not
# the branch tip.
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: build · test · format
    # **macos-26, and this is the whole of why the gate was red.** The `macos-15` image
    # defaults to Xcode 16.4 / Swift 6.1. Swift 6.2 changed main-actor isolation inference and
    # this codebase is written against it, so under 6.1 it does not compile — **126 errors**,
    # every one the same sentence: "main actor-isolated property … can not be referenced from a
    # nonisolated context". Seven runs, six branches, zero green: #267's diff was entirely
    # `BenchSnapshot` and it died in `Capture/WindowCapture.swift`, which no branch touched.
    #
    # The wrong fix is annotating files one at a time. #276 did two of them, honestly, and it
    # was treating a symptom — there were 124 more. **Pin the toolchain, not the source.**
    #
    # If this label ever goes away, the fix is still a toolchain pin (`setup-xcode` at 26.2 on
    # an image that carries it), never a sweep of `@MainActor` annotations to satisfy an older
    # compiler than the one anyone develops on.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # The path gate below diffs against the base branch, which needs its history.
          fetch-depth: 0

      # Printed before anything can fail, because the first red run cost an evening to diagnose
      # and one line would have answered it. Its hash keys the .build cache, because a build
      # from another compiler is not one this compiler can reuse.
      - name: toolchain
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "hash=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # A PR that changes only paths no Swift build or test reads (docs/, pi/, daemon/ except
      # its fixtures, markdown outside Sources/, Tests/ and skills) skips every step below, and
      # the job still reports success: it is a required check, and a required check that never
      # reports blocks the merge forever. The rule is `swift_ignores` in scripts/check.sh; any
      # path it does not name runs the job. A push to development always runs. Lint skips on
      # the same answer: every path it reads is one that runs this gate.
      - name: does this change need the Swift gate?
        id: needs
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
              || bash scripts/check.sh --needs swift "origin/${{ github.base_ref }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "only paths the Swift gate cannot read changed; skipping (scripts/check.sh swift_ignores)"
          fi

      # The pinned SwiftLint binary (tools/lint), about 25s to download otherwise.
      - name: cache SwiftLint
        if: steps.needs.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: tools/lint/.build
          key: swiftlint-${{ runner.os }}-${{ hashFiles('tools/lint/Package.swift') }}

      # Lint first: format and size findings arrive before the build and tests instead of after
      # them. `scripts/check.sh` defines every part, so this job and `just check` run the
      # same commands.
      - name: lint
        if: steps.needs.outputs.run == 'true'
        run: bash scripts/check.sh lint

      - name: install xcodegen
        if: (success() || failure()) && steps.needs.outputs.run == 'true'
        run: brew install xcodegen

      # Dependencies resolved, the GhosttyKit binary downloaded and the dependencies compiled,
      # as of the last push to development. PRs only restore: a cache saved per PR would churn
      # the repository's 10 GB limit for something only that PR's reruns could read. helm's
      # own sources recompile anyway, because checkout gives every file a new mtime.
      - name: restore .build
        if: (success() || failure()) && steps.needs.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/patch-libghostty.sh', 'Patches/**') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-

      # Patch, build, test, xcodegen. Runs even when lint failed, so one push shows both.
      #
      # HELM_CHECK_HEADLESS=1 skips TerminalKeyboardTests and WorkbenchFocusRoutingTests:
      # they need a real ghostty surface, and a surface needs an ACTIVE display (#253). A CI
      # runner has none, so those two would fail here for a reason that is not the diff.
      # Excluded rather than tolerated: a gate whose red is sometimes meaningless is a gate
      # nobody reads. scripts/check.sh is the one place the skip is spelled, together with
      # the INJECTION_NOGENERICS=1 that `--skip` needs (AGENTS.md).
      - name: build · test · xcodegen
        id: swift
        if: (success() || failure()) && steps.needs.outputs.run == 'true'
        env:
          HELM_CHECK_HEADLESS: '1'
        run: bash scripts/check.sh swift

      - name: save .build
        if: github.event_name == 'push' && steps.swift.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/patch-libghostty.sh', 'Patches/**') }}

  skills:
    name: skill gates
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # All three skill gates: canvas, board and post-canvas (scripts/check.sh). The board
      # and post-canvas gates need node, which this job already has by virtue of the runner
      # image. A gate that exists, is documented in AGENTS.md, and runs only when somebody
      # remembers is the drift this workflow exists to stop — #291 is the same lesson from the
      # other side.
      - name: skill gates
        run: bash scripts/check.sh skills
