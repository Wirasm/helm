# XcodeGen spec for the Helm.app bundle (`make app`).
#
# This is the .app graduation path only — the SPM path (`swift run helm`,
# `swift test`) stays primary for iteration and must keep working. Both build
# the same Sources/Helm against the same pinned libghostty-spm; keep the
# dependency here in lockstep with Package.swift (exact 1.3.1).
#
# Generated artifacts (Helm.xcodeproj, Info.plist, DerivedData) are gitignored;
# regenerate with `xcodegen generate` (wrapped by `make app`).
name: Helm
options:
  bundleIdPrefix: com.wirasm
  deploymentTarget:
    macOS: "14.0"

packages:
  # MUST match Package.swift precisely: libghostty's embedding API is pre-1.0
  # and churns between releases, so the pin is EXACT — see docs/SPIKE.md.
  # Currently the local patched checkout rather than the upstream tag (one
  # shared controller with N surfaces needs a wakeup fix upstream 1.3.1 lacks).
  # Run scripts/patch-libghostty.sh to materialize it; docs/VENDORED.md records
  # the patch and its retirement condition.
  libghostty-spm:
    path: vendor/libghostty-spm
  # Hot reload — MUST match Package.swift exactly, same as the pin above.
  # Effectively DEBUG-only: InjectionNext compiles to nothing in release and
  # Inject's modifiers become no-ops, so the .app ships unaffected.
  InjectionNext:
    url: https://github.com/johnno1962/InjectionNext.git
    exactVersion: 2.0.1
  Inject:
    url: https://github.com/krzysztofzablocki/Inject.git
    exactVersion: 1.6.0

targets:
  # What crosses the spool's process boundary (#221) — see Package.swift's `HelmWire` target
  # for the full argument. A local static library, mirroring SPM's plain `.target`: no product
  # of its own, linked into `Helm` below. MUST stay in lockstep with Package.swift — a source
  # added to one and not the other builds fine on one path and fails to find the symbol on the
  # other, silently, until someone runs `make app`.
  HelmWire:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/HelmWire
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # `package`-level access (SE-0386) needs every target that shares it to agree on a
        # package name — SPM sets this from `Package.swift`'s `name: "helm"` automatically,
        # but xcodegen's project has no such wiring, so `HelmWire`'s `package` types were
        # invisible to `Helm` here even though `swift build` saw them fine. Must match `Helm`'s
        # own `SWIFT_PACKAGE_NAME` below exactly, or the two targets are two packages again.
        SWIFT_PACKAGE_NAME: helm
  Helm:
    type: application
    platform: macOS
    sources:
      # Swift sources, minus Resources/ — which re-enters below as an explicit
      # resources build phase. MUST stay in lockstep with Package.swift's
      # `resources:` — the vendored marked.min.js + mermaid.min.js (see
      # docs/VENDORED.md) and helm's own canvas-annotation.js (#197) — same as
      # the libghostty pin above. This side is a directory glob, so a new .js
      # lands here for free and only Package.swift needs the extra line; that
      # asymmetry is why the lockstep is worth saying out loud rather than
      # trusting to memory. `CanvasAnnotationScriptTests` fails on the SPM side
      # if the script goes missing, and `make app` is what proves this one.
      - path: Sources/Helm
        excludes:
          - Resources/**
      - path: Sources/Helm/Resources
        excludes:
          - ghostty/**
        buildPhase: resources
      # The vendored ghostty shell-integration tree (docs/VENDORED.md) as a
      # FOLDER reference: xcodegen's per-file resources phase would flatten
      # the hierarchy (and drop zsh's hidden .zshenv); a folder reference
      # copies `ghostty/` into Resources verbatim, matching SPM's
      # `.copy("Resources/ghostty")`.
      - path: Sources/Helm/Resources/ghostty
        type: folder
        buildPhase: resources
      # The app icon. Lives outside Sources/ because it is a bundle concern only — the SPM
      # path (`swift run helm`) has no bundle to put it in, so Package.swift does not know
      # about it and does not need to. Committed rather than built: regenerating it needs
      # rsvg-convert and iconutil, and the gate takes only the Swift toolchain and xcodegen.
      # Edit Assets/icon/helm.svg and run Assets/icon/build-icon.sh to change it.
      - path: Assets/helm.icns
        buildPhase: resources
    dependencies:
      - target: HelmWire
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: InjectionNext
        product: InjectionNext
      - package: Inject
        product: Inject
    info:
      path: Info.plist # generated by xcodegen; gitignored
      properties:
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDisplayName: helm
        # Names Assets/helm.icns, which the resources phase above copies into the bundle.
        # No extension by convention; macOS appends .icns.
        CFBundleIconFile: helm
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wirasm.helm
        PRODUCT_NAME: Helm
        # Match Package.swift (swift-tools-version 6.0 → Swift 6 language mode).
        SWIFT_VERSION: "6.0"
        # Must match `HelmWire`'s `SWIFT_PACKAGE_NAME` above — see its comment.
        SWIFT_PACKAGE_NAME: helm
        # Hardened runtime OFF for now: local dev builds only, no notarization
        # yet. Revisit when helm ships outside this machine.
        ENABLE_HARDENED_RUNTIME: NO
        # App Sandbox OFF (no entitlements file, so no sandbox): helm hosts a
        # REAL login shell via libghostty (fork/exec of $SHELL with full user
        # filesystem access) and talks to the kild engine on localhost:4517 —
        # both are incompatible with the sandbox's process/network/file broker.
        # A sandboxed terminal that can't run your tools is useless; this is a
        # developer cockpit, not a Mac App Store candidate.
        CODE_SIGN_ENTITLEMENTS: ""
        # Ad-hoc signing for local dev: no team, no provisioning. "-" signs
        # with the ad-hoc identity so the bundle launches locally.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        # Interposable stubs are what make Swift methods swappable at runtime.
        # Debug only, mirroring Package.swift's linkerSettings — a release .app
        # keeps direct calls and never links anything injection-related.
        Debug:
          OTHER_LDFLAGS: ["-Xlinker", "-interposable"]
    scheme:
      testTargets: []
