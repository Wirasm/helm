# XcodeGen spec for the Helm.app bundle (`make app`).
#
# This is the .app graduation path only — the SPM path (`swift run helm`,
# `swift test`) stays primary for iteration and must keep working. Both build
# the same Sources/Helm against the same pinned libghostty-spm; keep the
# dependency here in lockstep with Package.swift (exact 1.3.1).
#
# Generated artifacts (Helm.xcodeproj, Info.plist, DerivedData) are gitignored;
# regenerate with `xcodegen generate` (wrapped by `make app`).
name: Helm
options:
  bundleIdPrefix: com.wirasm
  deploymentTarget:
    macOS: "14.0"

packages:
  # MUST match Package.swift precisely: libghostty's embedding API is pre-1.0
  # and churns between releases, so the pin is EXACT — see docs/SPIKE.md.
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    exactVersion: 1.3.1

targets:
  Helm:
    type: application
    platform: macOS
    sources:
      # Swift sources, minus Resources/ — which re-enters below as an explicit
      # resources build phase. MUST stay in lockstep with Package.swift's
      # `resources:` (vendored marked.min.js + mermaid.min.js — see
      # docs/VENDORED.md), same as the libghostty pin above.
      - path: Sources/Helm
        excludes:
          - Resources/**
      - path: Sources/Helm/Resources
        excludes:
          - ghostty/**
        buildPhase: resources
      # The vendored ghostty shell-integration tree (docs/VENDORED.md) as a
      # FOLDER reference: xcodegen's per-file resources phase would flatten
      # the hierarchy (and drop zsh's hidden .zshenv); a folder reference
      # copies `ghostty/` into Resources verbatim, matching SPM's
      # `.copy("Resources/ghostty")`.
      - path: Sources/Helm/Resources/ghostty
        type: folder
        buildPhase: resources
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
    info:
      path: Info.plist # generated by xcodegen; gitignored
      properties:
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDisplayName: helm
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wirasm.helm
        PRODUCT_NAME: Helm
        # Match Package.swift (swift-tools-version 6.0 → Swift 6 language mode).
        SWIFT_VERSION: "6.0"
        # Hardened runtime OFF for now: local dev builds only, no notarization
        # yet. Revisit when helm ships outside this machine.
        ENABLE_HARDENED_RUNTIME: NO
        # App Sandbox OFF (no entitlements file, so no sandbox): helm hosts a
        # REAL login shell via libghostty (fork/exec of $SHELL with full user
        # filesystem access) and talks to the kild engine on localhost:4517 —
        # both are incompatible with the sandbox's process/network/file broker.
        # A sandboxed terminal that can't run your tools is useless; this is a
        # developer cockpit, not a Mac App Store candidate.
        CODE_SIGN_ENTITLEMENTS: ""
        # Ad-hoc signing for local dev: no team, no provisioning. "-" signs
        # with the ad-hoc identity so the bundle launches locally.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
