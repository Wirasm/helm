# The bench daemon workspace. Deliberately NOT reachable from a repo-root Cargo.toml —
# `cargo` at the repo root should fail loudly, not half-work (bench-roadmap.md, M0).
[workspace]
resolver = "2"
members = [
    "crates/bench-wire",
    "crates/bench-session",
    "crates/bench-mail",
    "crates/bench-browser",
    "crates/bench-doc",
    "crates/bench-sessions",
    "crates/benchd",
    "crates/bench",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The operator's rules files (#356). Pinned exactly: a rules file is his, and a parser that
# changes what it accepts under him is a silent change to his bench.
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std"] }
time = { version = "0.3", features = ["formatting"] }
