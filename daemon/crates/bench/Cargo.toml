[package]
name = "bench"
version.workspace = true
edition.workspace = true
description = "The bench CLI: the one agent-facing surface over the benchd socket."

[dependencies]
# The document's own types, so a drawer name or a surface is spelled the way benchd reads it.
bench-doc = { path = "../bench-doc" }
bench-wire = { path = "../bench-wire" }
# `bench log` reads transcripts with the session list's own harness readers.
bench-sessions = { path = "../bench-sessions" }
serde_json.workspace = true
# The attach client reads its terminal's size to keep the session's pty matching it, and hears
# it change through SIGWINCH (libc: sigaction, pipe, poll).
libc = "0.2"
rustix = { version = "1.1.5", features = ["termios"] }

[dev-dependencies]
# The conformance suite runs `bench attach` on a pty of its own, as a helm pane does.
libc = "0.2"
rustix = { version = "1.1.5", features = ["pty", "process", "termios"] }

[lints]
workspace = true
