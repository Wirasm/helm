[package]
name = "bench-sessions"
version.workspace = true
edition.workspace = true
description = "Every agent session in a workspace, read from the harnesses' own files."

[dependencies]
bench-wire = { path = "../bench-wire" }
bench-doc = { path = "../bench-doc" }
bench-session = { path = "../bench-session" }
serde.workspace = true
serde_json.workspace = true
# RFC 3339 timestamps in transcripts, for `bench log --since`.
time = { workspace = true, features = ["parsing"] }
libc = "0.2"
memchr = "2"

[lints]
workspace = true
