name: helm-merge-queue
description: >-
  Land helm pull requests on development one at a time, under strict branch protection.
  For each PR in the order given: bring it up to date with update-branch, wait until every
  required check has passed on that exact head, merge pinned to the head, and read the merge
  commit's parents back. Stacked PRs are retargeted once the PR under them merged; a PR whose
  head is already in development is reported as landed through another. A prototype for
  shaping the merge-queue design; see README.md. Use when: "merge 412 413", "run the queue".

# Deterministic: the orchestrator decides what lands and in what order, so no node here is an
# agent. It runs from one fixed checkout (README), so Archon's path lock refuses a second
# queue run while one is live.
worktree:
  enabled: false

inputs:
  prs:
    required: true
    description: Pull request numbers in landing order, separated by spaces.
  mode:
    default: merge
    description: >-
      "merge" lands each PR. "preview" does every step except the merge, and those steps
      change the PRs: update-branch pushes a merge commit, a stacked PR is retargeted, and a
      PR whose checks never started is closed and reopened. It stops at tested. Every PR in a
      preview is compared with the same development, so only the first is meaningful when
      they touch each other.

returns: report

nodes:
  - id: intake
    script: intake
    runtime: uv
    output_format:
      type: object
      properties:
        queued: { type: array, items: { type: integer } }
        base_sha: { type: string }
        summary: { type: string }
      required: [queued, base_sha, summary]

  # One PR per iteration, start to finish: update, wait for CI, merge, read back. Testing
  # cannot run ahead of the merge on helm: strict protection only accepts a head that is up
  # to date with the real development, and that only exists once the PR before it merged.
  - id: candidates
    depends_on: [intake]
    loop_group:
      until_bash: test $step.output.done = true
      max_iterations: 20
      nodes:
        - id: step
          script: step
          runtime: uv
          timeout: 3600000
          output_format:
            type: object
            properties:
              done: { type: boolean }
              number: { type: integer }
              status:
                type: string
                enum: [merged, tested, held, landed_through, merged_unverified, none]
              summary: { type: string }
            required: [done, number, status, summary]

  - id: report
    script: report
    runtime: uv
    depends_on: [candidates]
    trigger_rule: all_done
    output_format:
      type: object
      properties:
        mode: { type: string }
        base_sha: { type: string }
        merged: { type: array, items: { type: integer } }
        tested: { type: array, items: { type: integer } }
        landed_through: { type: array, items: { type: integer } }
        held: { type: array, items: { type: integer } }
        unverified: { type: array, items: { type: integer } }
        queued: { type: array, items: { type: integer } }
        reasons: { type: object }
        stopped: { type: string }
        summary: { type: string }
      required: [mode, base_sha, merged, tested, landed_through, held, unverified, queued, reasons, stopped, summary]
